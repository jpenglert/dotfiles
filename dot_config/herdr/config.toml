onboarding = false

[ui.toast]
delivery = "system"

[theme]
name = "one-dark"
auto_switch = false

[ui.sound]
enabled = true

[keys]
next_agent = "ctrl+alt+n"
previous_agent = "ctrl+alt+p"

# reviewr: split the focused pane and open the diff review beside it, or close
# it again (reviewr's toggle_placement defaults to a right split).
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr beside this pane"
