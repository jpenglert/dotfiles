# Extensions for VS Code and Cursor (code-oss based editors)
extensions:
  # Installed to both VS Code and Cursor
  universal:
    - anthropic.claude-code           # Claude AI coding assistant
    - bierner.markdown-preview-github-styles  # GitHub-styled markdown preview
    - hbenl.vscode-test-explorer      # UI for running tests
    - gruntfuggly.todo-tree           # Tree view for TODO/FIXME comments
    - mermaidchart.vscode-mermaid-chart  # Mermaid diagram support
    - mikestead.dotenv                # .env file syntax highlighting
    - ms-azuretools.vscode-containers # Container management
    - ms-azuretools.vscode-docker     # Docker support
    - ms-vscode.makefile-tools        # Makefile support
    - ms-vscode.test-adapter-converter  # Test adapter for Test Explorer
    - redhat.vscode-yaml              # YAML language support
    - shopify.ruby-lsp                # Ruby language server
    - vue.volar                       # Vue.js language support

  # VS Code only
  vscode:
    - bierner.markdown-emoji          # Emoji support in markdown
    - ms-vscode-remote.remote-containers  # Dev containers

  # Cursor only
  cursor:
    - anysphere.remote-containers     # Dev containers (Cursor version)
